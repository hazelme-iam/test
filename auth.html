<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Auth Form</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      background: #F5F6F8;
      color: #10141A;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    form {
      background: #fff;
      border: 1px solid #DDE1E7;
      border-radius: 10px;
      padding: 20px;
      width: min(340px, 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 {
      font-size: 1.05rem;
      margin: 0 0 4px;
      font-weight: 700;
    }
    .lede {
      color: #5B616B;
      font-size: 12px;
      margin: 0 0 16px;
      line-height: 1.4;
    }
    .field {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    .field-helper {
      font-size: 11.5px;
      color: #5B616B;
      margin-top: 4px;
    }
    input {
      background: #F5F6F8;
      font-size: 14px;
      border: 1px solid #C5CAD3;
      border-radius: 6px;
      padding: 10px 12px;
      width: 100%;
      color: #10141A;
      outline: none;
      transition: background 0.15s, border-color 0.15s;
    }
    input:focus {
      background: #fff;
      border-color: #2F49E8;
    }
    input::placeholder {
      color: #8A8F98;
    }
    .error {
      color: #B42318;
      font-size: 12px;
      margin: 6px 0 0;
      display: none;
      font-weight: 500;
    }
    .field.invalid input {
      border-color: #B42318;
      background: #FDF2F2;
    }
    .field.invalid .error {
      display: block;
    }
    button {
      background: #2F49E8;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 11px 14px;
      width: 100%;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      font-family: inherit;
    }
    button:hover {
      background: #243bbd;
    }
    .ok {
      background: #E7F5F1;
      color: #0E7C66;
      font-size: 13px;
      border-radius: 6px;
      padding: 10px 12px;
      display: none;
      line-height: 1.4;
      margin-top: 10px;
    }
    .ok.show {
      display: block;
    }
  </style>
</head>
<body>

  <form id="auth-form" novalidate>
    <div>
      <h1>Create account</h1>
      <p class="lede">Single-column layout — one path from top to submit.</p>
    </div>

    <!-- Full name -->
    <div class="field">
      <label for="auth-fullname">Full name</label>
      <input 
        type="text" 
        id="auth-fullname" 
        placeholder="e.g. Jane Doe"
        autocomplete="name"
        aria-describedby="auth-fullname-error"
      >
      <span class="error" id="auth-fullname-error">Enter your full name.</span>
    </div>

    <!-- Work email -->
    <div class="field">
      <label for="auth-email">Work email</label>
      <input 
        type="email" 
        id="auth-email" 
        placeholder="name@company.com"
        autocomplete="email"
        aria-describedby="auth-email-error"
      >
      <span class="error" id="auth-email-error">Enter a valid email address.</span>
    </div>

    <!-- Company -->
    <div class="field">
      <label for="auth-company">Company</label>
      <input 
        type="text" 
        id="auth-company" 
        placeholder="Acme Studio (optional)"
        autocomplete="organization"
        aria-describedby="auth-company-helper"
      >
      <span class="field-helper" id="auth-company-helper">Company is optional — leave blank or type a name.</span>
    </div>

    <!-- Button -->
    <button type="submit">Create account</button>

    <!-- Feedback -->
    <div class="ok" id="auth-ok" role="status" aria-live="polite">
      Account details look good — ready to continue.
    </div>
  </form>

  <script>
    const form = document.getElementById('auth-form');
    const nameInput = document.getElementById('auth-fullname');
    const emailInput = document.getElementById('auth-email');
    const okBanner = document.getElementById('auth-ok');

    function validateField(inputEl, testFn) {
      const field = inputEl.closest('.field');
      const valid = testFn(inputEl.value.trim());
      if (!valid) {
        field.classList.add('invalid');
        inputEl.setAttribute('aria-invalid', 'true');
      } else {
        field.classList.remove('invalid');
        inputEl.removeAttribute('aria-invalid');
      }
      return valid;
    }

    nameInput.addEventListener('input', () => {
      if (nameInput.value.trim().length >= 2) {
        nameInput.closest('.field').classList.remove('invalid');
      }
      okBanner.classList.remove('show');
    });

    emailInput.addEventListener('input', () => {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (emailRegex.test(emailInput.value.trim())) {
        emailInput.closest('.field').classList.remove('invalid');
      }
      okBanner.classList.remove('show');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const validName = validateField(nameInput, val => val.length >= 2);
      const validEmail = validateField(emailInput, val => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val));

      if (validName && validEmail) {
        okBanner.classList.add('show');
      } else {
        okBanner.classList.remove('show');
        form.querySelector('.field.invalid input')?.focus();
      }
    });
  </script>
</body>
</html>
